{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Gestión de eventos{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/estilos.css' %}">
</head>
<body>
    <header class="cabecera">
        <div class="contenedor">
            <span class="logo">Gestión de eventos</span>
            <nav>
                <a href="{% url 'eventos:lista' %}">Eventos</a>
                <a href="{% url 'confirmacion:confirmar' %}">Confirmar asistencia</a>
            </nav>
        </div>
    </header>

    <main class="contenedor principal">
        {% block contenido %}{% endblock %}
    </main>

    <footer class="pie">
        <div class="contenedor">
            <p>Proyecto didáctico con Django</p>
        </div>
    </footer>
</body>
</html>
